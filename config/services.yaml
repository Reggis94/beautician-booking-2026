# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.profile_pro.finance.stripe_preview_version: '2026-02-25.preview'
    app.platform_name: 'Glam4Style'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/tests/'

    App\Availability\UI\Http\Controller\:
        resource: '../src/Availability/UI/Http/Controller/'
        tags: ['controller.service_arguments']
    App\Booking\UI\Http\Controller\:
        resource: '../src/Booking/UI/Http/Controller/'
        tags: ['controller.service_arguments']
    App\ProfilePro\UI\Http\Controller\:
        resource: '../src/ProfilePro/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Dao\ProDaoInterface: '@App\Dao\ProDao'
    App\Services\Application\ServiceCategory\Dao\ServiceCategoryDaoInterface: '@App\Services\Infrastructure\Dao\ServiceCategoryDao'
    App\Services\Application\Service\Dao\ServiceDaoInterface: '@App\Services\Infrastructure\Dao\ServiceDao'
    App\Booking\Application\Repository\Appointment\OverlapRepositoryInterface: '@App\Booking\Infrastructure\Repository\Appointment\OverlapRepository'
    App\Booking\Application\Repository\Appointment\AppointmentRepositoryInterface: '@App\Booking\Infrastructure\Repository\Appointment\AppointmentRepository'
    App\Availability\Public\Query\IsWithinProBusinessTimeQueryInterface: '@App\Availability\Public\Query\IsWithinProBusinessTime'

    App\ProfilePro\Application\Timezone\Port\TimezoneResolverPortInterface: '@App\ProfilePro\Infrastructure\Api\TimezoneDb\Adapter\TimezoneDbAdapter'
    App\ProfilePro\Application\CommandHandler\CreateStripeConnectedAccountTokenCommandHandler:
        arguments:
            $stripePreviewVersion: '%app.profile_pro.finance.stripe_preview_version%'
    App\ProfilePro\Application\CommandHandler\CreateStripeConnectedAccountCommandHandler:
        arguments:
            $platformName: '%app.platform_name%'
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
