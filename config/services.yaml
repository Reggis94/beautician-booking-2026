# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

    tracking.visitor_id_length: 20
    tracking.demo_and_marketing_max_age: 15552000
    tracking.guard.short.limit: 60
    tracking.guard.short.window_seconds: 120
    tracking.guard.medium.limit: 120
    tracking.guard.medium.window_seconds: 7200
    tracking.guard.long.limit: 300
    tracking.guard.long.window_seconds: 86400
    tracking.guard.block_seconds: 86400
    tracking.guard.user_agent_min_length: 20

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/tests/'

    App\Availability\UI\Http\Controller\:
        resource: '../src/Availability/UI/Http/Controller/'
        tags: ['controller.service_arguments']
    App\Booking\UI\Http\Controller\:
        resource: '../src/Booking/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Services\UI\Http\Controller\:
        resource: '../src/Services/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Dao\ProDaoInterface: '@App\Dao\ProDao'
    App\Services\Application\ServiceCategory\Dao\ServiceCategoryDaoInterface: '@App\Services\Infrastructure\Dao\ServiceCategoryDao'
    App\Services\Application\Service\Dao\ServiceDaoInterface: '@App\Services\Infrastructure\Dao\ServiceDao'
    App\Booking\Application\Repository\Appointment\OverlapRepositoryInterface: '@App\Booking\Infrastructure\Repository\Appointment\OverlapRepository'
    App\Booking\Application\Repository\Appointment\AppointmentRepositoryInterface: '@App\Booking\Infrastructure\Repository\Appointment\AppointmentRepository'
    App\Availability\Public\Query\ServiceIsWithinProBusinessTimeQueryInterface: '@App\Availability\Public\Query\ServiceIsWithinProBusinessTime'
    App\Availability\Domain\Repository\AvailabilityRepositoryInterface: '@App\Availability\Infrastructure\Repository\AvailabilityRepository'
    App\ProfilePro\Application\Timezone\Port\TimezoneResolverPortInterface: '@App\ProfilePro\Infrastructure\Api\TimezoneDb\Adapter\TimezoneDbAdapter'
    App\Tracking\Application\Dao\VisitorTrackingDaoInterface: '@App\Tracking\Infrastructure\Dao\VisitorTrackingDao'
    App\Tracking\Application\Guard\VisitedPageRequestGuardInterface: '@App\Tracking\Application\Guard\VisitedPageRequestGuard'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
