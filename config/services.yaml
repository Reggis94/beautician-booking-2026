# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

    tracking.visitor_id_length: 20
    tracking.demo_and_marketing_max_age: 15552000

    # ProAuth: passwordless email authentication for beauticians.
    # AUTH_LOGIN_CONFIRM_URL and MAILER_FROM_EMAIL have no default and must be set.
    env(AUTH_ALLOWED_ORIGINS): ''
    env(AUTH_SESSION_COOKIE_SECURE): 'true'
    env(AUTH_SESSION_COOKIE_SAMESITE): 'lax'
    env(AUTH_SESSION_COOKIE_MAX_AGE_SECONDS): '34560000'
    env(MAILER_FROM_NAME): 'Glam4Style'
    pro_auth.login_confirm_url: '%env(AUTH_LOGIN_CONFIRM_URL)%'
    pro_auth.allowed_origins: '%env(csv:AUTH_ALLOWED_ORIGINS)%'
    pro_auth.session_cookie_name: 'pro_session'
    pro_auth.session_cookie_secure: '%env(bool:AUTH_SESSION_COOKIE_SECURE)%'
    pro_auth.session_cookie_samesite: '%env(AUTH_SESSION_COOKIE_SAMESITE)%'
    pro_auth.session_cookie_max_age_seconds: '%env(int:AUTH_SESSION_COOKIE_MAX_AGE_SECONDS)%'
    pro_auth.mailer_from_email: '%env(MAILER_FROM_EMAIL)%'
    pro_auth.mailer_from_name: '%env(MAILER_FROM_NAME)%'
    # Login link requests of one beautician: at least 60 seconds apart, at most 24 over the last hour.
    pro_auth.login_link_cooldown_seconds: 60
    pro_auth.login_link_rate_limit_max_requests: 24
    pro_auth.login_link_rate_limit_window_seconds: 3600

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude: '../src/tests/'

    App\Availability\UI\Http\Controller\:
        resource: '../src/Availability/UI/Http/Controller/'
        tags: ['controller.service_arguments']
    App\Booking\UI\Http\Controller\:
        resource: '../src/Booking/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Services\UI\Http\Controller\:
        resource: '../src/Services/UI/Http/Controller/'
        tags: ['controller.service_arguments']

    App\Dao\ProDaoInterface: '@App\Dao\ProDao'
    App\Services\Application\ServiceCategory\Dao\ServiceCategoryDaoInterface: '@App\Services\Infrastructure\Dao\ServiceCategoryDao'
    App\Services\Application\Service\Dao\ServiceDaoInterface: '@App\Services\Infrastructure\Dao\ServiceDao'
    App\Booking\Application\Repository\Appointment\OverlapRepositoryInterface: '@App\Booking\Infrastructure\Repository\Appointment\OverlapRepository'
    App\Booking\Application\Repository\Appointment\AppointmentRepositoryInterface: '@App\Booking\Infrastructure\Repository\Appointment\AppointmentRepository'
    App\Availability\Public\Query\ServiceIsWithinProBusinessTimeQueryInterface: '@App\Availability\Public\Query\ServiceIsWithinProBusinessTime'
    App\Availability\Domain\Repository\AvailabilityRepositoryInterface: '@App\Availability\Infrastructure\Repository\AvailabilityRepository'
    App\ProfilePro\Application\Timezone\Port\TimezoneResolverPortInterface: '@App\ProfilePro\Infrastructure\Api\TimezoneDb\Adapter\TimezoneDbAdapter'
    App\Tracking\Application\Dao\VisitorTrackingDaoInterface: '@App\Tracking\Infrastructure\Dao\VisitorTrackingDao'
    App\ProAuth\Application\Dao\LoginTokenDaoInterface: '@App\ProAuth\Infrastructure\Dao\LoginTokenDao'
    App\ProAuth\Application\Dao\SessionDaoInterface: '@App\ProAuth\Infrastructure\Dao\SessionDao'
    App\ProAuth\Application\Mailer\LoginLinkMailerInterface: '@App\ProAuth\Infrastructure\Mailer\SymfonyLoginLinkMailer'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
